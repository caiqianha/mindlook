<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindlook · XMind 查看器</title>
<meta name="description" content="不装软件也能查看 .xmind 思维导图。文件只在浏览器本地解析，不上传。">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1b1f24; --muted:#6a7380; --line:#dfe3e8; --soft:#eef0f3;
  --paper:#ffffff; --accent:#2f6fed; --hit:#ffd54a; --hit-ink:#5b4300;
  --shadow:0 1px 2px rgba(16,24,40,.08),0 4px 14px rgba(16,24,40,.06);
  --c0:#2f6fed; --c1:#0f9d6e; --c2:#e0821b; --c3:#d9414e; --c4:#7b4fe0; --c5:#0c93b4; --c6:#d1479c; --c7:#6f9c0c;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --panel:#191d23; --ink:#e8eaed; --muted:#98a2ad; --line:#2a3039; --soft:#20252c;
    --paper:#111418; --accent:#6b9cff; --hit:#f2c94c; --hit-ink:#2b2000;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
    --c0:#6b9cff; --c1:#3ccf9a; --c2:#f5a34a; --c3:#ff6b76; --c4:#a98bff; --c5:#3fc3e3; --c6:#f07ac0; --c7:#a6d43c;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#191d23; --ink:#e8eaed; --muted:#98a2ad; --line:#2a3039; --soft:#20252c;
  --paper:#111418; --accent:#6b9cff; --hit:#f2c94c; --hit-ink:#2b2000;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
  --c0:#6b9cff; --c1:#3ccf9a; --c2:#f5a34a; --c3:#ff6b76; --c4:#a98bff; --c5:#3fc3e3; --c6:#f07ac0; --c7:#a6d43c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"SF Pro Text","PingFang SC","Segoe UI","Microsoft YaHei",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- 顶栏 ---- */
.bar{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em;padding-right:10px;border-right:1px solid var(--line);height:28px}
.brand .logo{width:22px;height:22px}
.file{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow:hidden}
.file .fname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:32vw}
.tabs{display:flex;gap:2px;overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:3px 10px;border-radius:999px;color:var(--muted);white-space:nowrap}
.tabs button:hover{background:var(--soft);color:var(--ink)}
.tabs button.active{background:var(--ink);color:var(--paper)}
.tools{display:flex;align-items:center;gap:4px;flex:none}
.search{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:8px;padding:0 8px;height:30px;color:var(--muted);width:200px;transition:width .15s}
.search:focus-within{width:260px;background:var(--panel);box-shadow:0 0 0 2px var(--accent)}
.search input{border:0;background:none;color:var(--ink);font:inherit;min-width:0;flex:1;height:100%}
.search input::placeholder{color:var(--muted)}
.search .cnt{font-size:12px;white-space:nowrap}
.search kbd{font:11px/1 inherit;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 8px;border-radius:8px;color:var(--muted)}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.active{background:var(--soft);color:var(--ink)}
.ib.primary{background:var(--ink);color:var(--paper);padding:0 12px}
.ib.primary:hover{opacity:.9;color:var(--paper)}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;color:var(--muted);font-size:13px}
.seg button.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:36px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;display:none;z-index:20}
.menu.open .pop{display:block}
.pop button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:6px;text-align:left;font-size:13px}
.pop button:hover{background:var(--soft)}
.pop .sep{height:1px;background:var(--line);margin:4px 0}
.pop .lab{font-size:11px;color:var(--muted);padding:4px 10px 2px}
.pop button.on::after{content:"✓";margin-left:auto;color:var(--accent)}
.only-sm{display:none}

/* ---- 舞台 ---- */
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
#stage.panning{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#links,#rels,#decor{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#decor .bd{fill-opacity:.07;stroke-width:1.5;stroke-dasharray:6 4}
#decor .bdt{font-size:12px;font-weight:500}
#decor .br{fill:none;stroke-width:1.5}
#links path{fill:none;stroke-width:2;stroke-linecap:round}
#links path.floating{stroke-dasharray:5 5}
#rels path{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4}
#rels text{font-size:11px;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
#nodes{position:absolute;left:0;top:0}
.node{position:absolute;width:max-content;max-width:300px;padding:7px 12px;border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word;user-select:none;cursor:default;line-height:1.4}
.node.d0{background:var(--ink);color:var(--paper);font-size:17px;font-weight:600;padding:11px 20px;border-radius:14px;max-width:340px;box-shadow:none}
.node.d1{background:var(--branch);color:#fff;font-weight:500;box-shadow:none}
.node.deep{background:none;box-shadow:none;border-radius:0;padding:3px 8px 4px;border-bottom:2px solid var(--branch)}
.node.card{background:var(--panel);box-shadow:none;border:1px solid var(--line);border-left:3px solid var(--branch)}
.node.sum{background:var(--panel);box-shadow:none;border:1.5px solid var(--branch);color:var(--ink);font-weight:400}
.node.floating{border:1.5px dashed var(--branch);background:var(--panel);color:var(--ink);font-weight:400;box-shadow:none}
.node.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.node.hit{background:var(--hit);color:var(--hit-ink);box-shadow:0 0 0 2px var(--hit)}
.node.hit.cur{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--hit-ink)}
.node .lbl{display:block;font-size:11px;opacity:.75;margin-top:1px}
.node .mk{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:rgba(127,127,127,.18);font-size:11px;font-weight:600;margin-right:4px;vertical-align:-3px}
.node .mk.p{background:var(--c3);color:#fff}
.node .nt{display:inline-block;margin-left:6px;font-size:12px;opacity:.75}
.node img{display:block;border-radius:6px;margin-bottom:6px}
.node a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.node .tg{position:absolute;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--panel);color:var(--ink);border:1.5px solid var(--branch);font-size:11px;line-height:15px;text-align:center;cursor:pointer;z-index:1}
.node .tg.r{right:-11px}.node .tg.l{left:-11px}
.node .tg.b,.node .tg.t{left:50%;transform:translateX(-50%)}.node .tg.b{top:auto;bottom:-11px}.node .tg.t{top:-11px}
.node .tg:hover{background:var(--branch);color:#fff}
.node.has-notes{cursor:pointer}

/* ---- HUD ---- */
.hud{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;z-index:4}
.hud .grp{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);height:32px;overflow:hidden}
.hud .grp button{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.hud .grp button:hover{background:var(--soft);color:var(--ink)}
.hud .pct{min-width:48px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud .stat{font-size:12px;color:var(--muted)}
.help-btn{position:absolute;right:12px;bottom:12px;z-index:4;width:32px;height:32px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.help-btn:hover{color:var(--ink)}
.focusbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:5px 6px 5px 14px;display:none;align-items:center;gap:10px;font-size:13px;z-index:4;max-width:calc(100% - 24px)}
.focusbar.show{display:flex}
.focusbar b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focusbar button{border-radius:999px;padding:3px 10px;background:var(--soft);font-size:12px}
.coach{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 16px;font-size:13px;display:none;align-items:center;gap:12px;z-index:6;max-width:calc(100% - 200px);box-shadow:var(--shadow)}
.coach.show{display:flex}
.coach button{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
:root[data-theme="dark"] .coach button,:root:not([data-theme="light"]) .coach button{background:rgba(0,0,0,.15)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:30}
#toast.show{opacity:1}

/* ---- 备注面板 ---- */
#detail{position:absolute;right:12px;bottom:56px;width:min(400px,calc(100% - 24px));max-height:45%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:none;z-index:5}
#detail.show{display:block}
#detail h3{margin:0 24px 6px 0;font-size:14px}
#detail .notes{font-size:13px;line-height:1.6;color:var(--muted);white-space:pre-wrap}
#detail .notes.rich{white-space:normal}
#detail .notes p{margin:0 0 6px}#detail .notes ul,#detail .notes ol{margin:4px 0;padding-left:20px}#detail .notes a{color:var(--accent)}#detail .notes img{max-width:100%;border-radius:6px;display:block;margin:6px 0}#detail .notes code,#detail .notes pre{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:4px;padding:1px 4px}#detail .notes pre{padding:8px;overflow:auto}#detail .notes blockquote{margin:4px 0;padding-left:10px;border-left:2px solid var(--line)}#detail .notes h1,#detail .notes h2,#detail .notes h3{font-size:14px;margin:8px 0 4px;color:var(--ink)}
#detail .x{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:6px;color:var(--muted)}
#detail .x:hover{background:var(--soft)}

/* ---- 大纲 ---- */
#outline{position:absolute;inset:0;overflow:auto;padding:24px 32px 80px;display:none;background:var(--bg);cursor:auto}
#outline.show{display:block}
#outline .wrap{max-width:760px;margin:0 auto}
#outline ul{list-style:none;padding-left:22px;margin:0;border-left:1px solid var(--line)}
#outline > .wrap > ul{padding-left:0;border:0}
#outline li{margin:4px 0;position:relative}
#outline summary{cursor:pointer;list-style:none;display:inline-block;padding:2px 6px;border-radius:5px}
#outline summary::-webkit-details-marker{display:none}
#outline summary:hover{background:var(--soft)}
#outline summary::before{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin:0 10px 2px 2px;transition:transform .12s}
#outline details[open]>summary::before{transform:rotate(45deg)}
#outline .leaf{padding:2px 6px;display:inline-block}
#outline .leaf::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 11px 2px 2px}
#outline .d0>summary{font-size:20px;font-weight:600;padding:4px 6px}
#outline .d1>summary,#outline .d1 .leaf{font-weight:500}
#outline .note{color:var(--muted);font-size:12.5px;margin:2px 0 4px 28px;white-space:pre-wrap;border-left:2px solid var(--line);padding-left:8px}
#outline mark{background:var(--hit);color:var(--hit-ink);border-radius:2px}

/* ---- 空状态 ---- */
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:8;cursor:auto;padding:16px}
#empty.hidden{display:none}
#empty .box{width:min(560px,100%);padding:40px 32px;border:1.5px dashed var(--line);border-radius:20px;background:var(--panel);text-align:center;transition:border-color .15s,background .15s}
body.dragging #empty{display:flex;background:var(--bg)}
body.dragging #empty .box{border-color:var(--accent);background:var(--soft)}
#empty .mark{width:64px;height:64px;margin:0 auto 18px}
#empty h1{font-size:22px;margin:0 0 8px;font-weight:600}
#empty p{color:var(--muted);margin:6px 0;font-size:14px}
#empty .act{display:flex;gap:8px;justify-content:center;margin:18px 0 8px;flex-wrap:wrap}
#empty .act .ib{height:36px;padding:0 16px;border-radius:9px}
#empty .act .ib.ghost{border:1px solid var(--line);color:var(--ink)}
#empty code{display:block;background:var(--soft);padding:10px 12px;border-radius:8px;margin-top:8px;text-align:left;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;user-select:all;color:var(--ink)}
#empty .err{color:var(--c3);margin-top:12px;font-size:13px;white-space:pre-wrap}
#empty details{margin-top:14px;color:var(--muted);font-size:13px}
#empty summary{cursor:pointer}

/* ---- 帮助 ---- */
#help{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40;cursor:auto;padding:16px}
#help.show{display:flex}
#help .card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90%;overflow:auto;padding:22px 24px;position:relative}
#help h2{margin:0 0 14px;font-size:17px}
#help table{width:100%;border-collapse:collapse;font-size:13.5px}
#help td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
#help td:first-child{width:46%;color:var(--muted)}
#help kbd{display:inline-block;font:12px/1 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;margin:0 2px;background:var(--soft);color:var(--ink)}
#help .x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:7px;color:var(--muted)}
#help .x:hover{background:var(--soft)}
#help .foot{margin-top:14px;font-size:12.5px;color:var(--muted)}

@media (max-width:760px){
  .bar{gap:6px;padding:0 8px}
  .brand span{display:none}
  .brand{border:0;padding:0}
  .file .fname{max-width:40vw}
  .search{width:34px;padding:0 9px}
  .search input,.search .cnt,.search kbd{display:none}
  .search:focus-within{width:180px}
  .search:focus-within input{display:block}
  .hide-sm{display:none}
  .only-sm{display:inline-flex}
  .coach{max-width:calc(100% - 24px);bottom:56px}
  .hud .stat{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{.bar,.hud,.help-btn,.coach,#detail,#empty{display:none!important}#stage{overflow:visible}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><path d="M15 12h4M5 12h4M14.5 10l3-4M14.5 14l3 4M9.5 10l-3-4M9.5 14l-3 4"/></svg>
    <span>Mindlook</span>
  </div>
  <div class="file"><span class="fname" id="fname"></span><div class="tabs" id="tabs"></div></div>
  <div class="tools">
    <label class="search" id="searchBox" title="">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <span class="cnt" id="qcnt"></span>
      <kbd id="qkbd">⌘K</kbd>
    </label>
    <div class="seg hide-sm" id="viewSeg"><button data-v="map" class="active"></button><button data-v="outline"></button></div>
    <div class="menu hide-sm" id="levelMenu"><button class="ib" id="levelBtn"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg><span></span></button><div class="pop" id="levelPop"></div></div>
    <div class="menu" id="exportMenu"><button class="ib" id="exportBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg><span class="hide-sm"></span></button><div class="pop" id="exportPop"></div></div>
    <div class="menu" id="moreMenu"><button class="ib" id="moreBtn" title=""><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg></button><div class="pop" id="morePop"></div></div>
    <button class="ib primary" id="btnOpen"><svg class="i" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg><span class="hide-sm"></span></button>
  </div>
</header>

<div id="stage">
  <div id="canvas"><svg id="decor"></svg><svg id="links"></svg><div id="nodes"></div><svg id="rels"></svg></div>
  <div id="outline"><div class="wrap"></div></div>
  <div class="focusbar" id="focusbar"><span id="focusLab"></span><b id="focusTitle"></b><button id="focusBack"></button></div>
  <div class="hud">
    <div class="grp"><button id="zOut" title="">−</button><span class="pct" id="pct">100%</span><button id="zIn" title="">+</button><button id="zFit" title=""><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
    <span class="stat" id="stat"></span>
  </div>
  <button class="help-btn" id="helpBtn" title="">?</button>
  <div class="coach" id="coach"><span id="coachText"></span><button id="coachOk"></button></div>
  <div id="detail"><button class="x" id="dClose">×</button><h3 id="dTitle"></h3><div id="dNotes" class="notes"></div></div>
  <div id="empty">
    <div class="box">
      <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><circle cx="32" cy="32" r="6" fill="var(--accent)" stroke="none"/><path d="M38 32h12M14 32h12M37 27l9-10M37 37l9 10M27 27l-9-10M27 37l-9 10"/><circle cx="50" cy="17" r="3"/><circle cx="50" cy="47" r="3"/><circle cx="14" cy="17" r="3"/><circle cx="14" cy="47" r="3"/></svg>
      <h1 id="eTitle"></h1>
      <p id="eHint"></p>
      <div class="act"><button class="ib primary" id="eOpen"></button><button class="ib ghost" id="eDemo"></button></div>
      <p id="ePriv"></p>
      <details><summary id="eCliLab"></summary><code>xmindview /path/to/file.xmind</code></details>
      <div class="err" id="err"></div>
    </div>
  </div>
  <div id="help"><div class="card"><button class="x" id="helpClose">×</button><h2 id="helpTitle"></h2><table id="helpTable"></table><p class="foot" id="helpFoot"></p></div></div>
  <div id="toast"></div>
</div>
<input type="file" id="file" accept=".xmind,application/zip,application/octet-stream" hidden>
<!--XMIND_DATA-->
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'),canvas=$('#canvas'),links=$('#links'),rels=$('#rels'),nodesEl=$('#nodes'),emptyEl=$('#empty'),errEl=$('#err');

/* ================= zip 读取（原生，不依赖外部库） ================= */
async function readZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder('utf-8');
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error(t('errNotZip'));
  const count=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true);
  const files={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    files[td.decode(u8.subarray(p+46,p+46+nlen))]={method,csize,lho};
    p+=46+nlen+elen+clen;
  }
  async function bytes(n){
    const f=files[n], q=f.lho;
    if(dv.getUint32(q,true)!==0x04034b50) throw new Error('zip entry broken: '+n);
    const start=q+30+dv.getUint16(q+26,true)+dv.getUint16(q+28,true);
    const data=u8.subarray(start,start+f.csize);
    if(f.method===0) return data;
    if(f.method!==8) throw new Error('unsupported zip method '+f.method);
    if(typeof DecompressionStream==='undefined') throw new Error(t('errOldBrowser'));
    const resp=new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')));
    return new Uint8Array(await resp.arrayBuffer());
  }
  return { has:n=>Object.prototype.hasOwnProperty.call(files,n), bytes, async text(n){ return td.decode(await bytes(n)); } };
}
const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',bmp:'image/bmp'};
function imgSize(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res({src,w:im.naturalWidth||1,h:im.naturalHeight||1}); im.onerror=()=>res(null); im.src=src; }); }
async function prepareRes(map){ const out={}; for(const k in map){ const r=await imgSize(map[k]); if(r) out[k]=r; } return out; }
function toDataUrl(u8,name){ const ext=(name.split('.').pop()||'').toLowerCase(); return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(new Blob([u8],{type:MIME[ext]||'application/octet-stream'})); }); }

/* 富文本备注：白名单清洗，可同时处理 HTML DOM 与 XMind 8 的 XHTML 节点 */
const NOTE_TAGS={p:1,br:1,b:1,strong:1,i:1,em:1,u:1,s:1,strike:1,ul:1,ol:1,li:1,a:1,span:1,div:1,h1:1,h2:1,h3:1,h4:1,h5:1,h6:1,blockquote:1,code:1,pre:1,img:1};
function sanitizeInto(src,out){
  for(const c of src.childNodes){
    if(c.nodeType===3){ out.appendChild(document.createTextNode(c.nodeValue)); continue; }
    if(c.nodeType!==1) continue;
    const tag=(c.localName||'').toLowerCase();
    if(/^(script|style|iframe|object|embed|svg|math|template)$/.test(tag)) continue;
    if(!NOTE_TAGS[tag]){ sanitizeInto(c,out); continue; }
    if(tag==='img'){ const s=c.getAttribute('src')||c.getAttribute('xhtml:src')||c.getAttributeNS('http://www.w3.org/1999/xhtml','src')||''; if(/^xap:/.test(s)){ const im=document.createElement('img'); im.alt=''; im.dataset.res=s.replace(/^xap:/,''); out.appendChild(im); } continue; }
    const el=document.createElement(tag==='strike'?'s':tag);
    if(tag==='a'){ const h=c.getAttribute('href')||c.getAttribute('xlink:href')||''; if(/^https?:/i.test(h)){ el.href=h; el.target='_blank'; el.rel='noopener'; } }
    const st=c.getAttribute('style')||''; const keep=[];
    if(/font-weight:\s*(bold|[6-9]00)/i.test(st)) keep.push('font-weight:600');
    if(/font-style:\s*italic/i.test(st)) keep.push('font-style:italic');
    if(/text-decoration[^;]*underline/i.test(st)) keep.push('text-decoration:underline');
    if(/line-through/i.test(st)) keep.push('text-decoration:line-through');
    if(keep.length) el.style.cssText=keep.join(';');
    sanitizeInto(c,el); out.appendChild(el);
  }
}
function notesFromHtmlString(html){ const doc=new DOMParser().parseFromString(html,'text/html'); const out=document.createElement('div'); sanitizeInto(doc.body,out); return out; }
function parseRange(r){ const m=/\(\s*(\d+)\s*,\s*(\d+)\s*\)/.exec(r||''); return m?[+m[1],+m[2]]:null; }
function topicFromJson(x,floating){
  if(!x) return {id:'',title:'',children:[],attached:0};
  const kids=[]; let attached=0, sumTopics=[];
  if(x.children){
    (x.children.attached||[]).forEach(c=>kids.push(topicFromJson(c,false))); attached=kids.length;
    (x.children.detached||[]).forEach(c=>kids.push(topicFromJson(c,true)));
    sumTopics=(x.children.summary||[]).map(c=>topicFromJson(c,false));
  }
  let notes='', notesEl=null;
  if(x.notes){
    if(x.notes.realHTML&&x.notes.realHTML.content){ notesEl=notesFromHtmlString(x.notes.realHTML.content); notes=(x.notes.plain&&x.notes.plain.content)||notesEl.textContent; }
    else if(x.notes.plain&&x.notes.plain.content) notes=x.notes.plain.content;
  }
  const summaries=(x.summaries||[]).map((s,i)=>({range:parseRange(s.range),topic:sumTopics.find(tp=>tp.id===s.topicId)||sumTopics[i]||null})).filter(s=>s.range&&s.topic);
  const boundaries=(x.boundaries||[]).map(b=>({range:parseRange(b.range),title:b.title||''})).filter(b=>b.range);
  return {id:x.id||'',title:x.title||'',notes,notesEl,labels:x.labels||[],href:x.href||null,image:x.image&&x.image.src?x.image.src:null,
    structure:x.structureClass||null,summaries,boundaries,attached,
    markers:(x.markers||[]).map(m=>m.markerId),children:kids,floating:!!floating,collapsed:false};
}
function fromJson(text){
  const json=JSON.parse(text); const arr=Array.isArray(json)?json:[json];
  return arr.map((s,i)=>({title:s.title||(t('sheet')+' '+(i+1)),root:topicFromJson(s.rootTopic,false),
    rels:(s.relationships||[]).map(r=>({a:r.end1Id,b:r.end2Id,title:r.title||''}))}));
}
function topicFromXml(el,floating){
  const n={id:'',title:'',notes:'',notesEl:null,labels:[],children:[],attached:0,markers:[],floating:!!floating,collapsed:false,href:null,image:null,structure:null,summaries:[],boundaries:[]};
  if(!el) return n;
  n.id=el.getAttribute('id')||''; n.structure=el.getAttribute('structure-class')||null;
  n.href=el.getAttribute('xlink:href')||el.getAttributeNS('http://www.w3.org/1999/xlink','href')||null;
  const sumTopics=[], sumRefs=[];
  for(const c of el.children){
    switch(c.localName){
      case 'title': n.title=c.textContent; break;
      case 'notes': { const p=[...c.children].find(x=>x.localName==='plain'); const h=[...c.children].find(x=>x.localName==='html'); if(h){ n.notesEl=document.createElement('div'); sanitizeInto(h,n.notesEl); } n.notes=(p?p.textContent:(n.notesEl?n.notesEl.textContent:c.textContent)).trim(); break; }
      case 'labels': n.labels=[...c.children].map(x=>x.textContent); break;
      case 'marker-refs': n.markers=[...c.children].map(x=>x.getAttribute('marker-id')); break;
      case 'img': n.image=c.getAttribute('xhtml:src')||c.getAttributeNS('http://www.w3.org/1999/xhtml','src')||null; break;
      case 'boundaries': [...c.children].filter(x=>x.localName==='boundary').forEach(b=>{ const r=parseRange(b.getAttribute('range')); if(r) n.boundaries.push({range:r,title:([...b.children].find(x=>x.localName==='title')||{}).textContent||''}); }); break;
      case 'summaries': [...c.children].filter(x=>x.localName==='summary').forEach(s=>sumRefs.push({range:parseRange(s.getAttribute('range')),topicId:s.getAttribute('topic-id')})); break;
      case 'children':
        for(const topics of c.children){ if(topics.localName!=='topics') continue; const type=topics.getAttribute('type');
          for(const tp of topics.children){ if(tp.localName!=='topic') continue; const k=topicFromXml(tp,type==='detached'); if(type==='summary') sumTopics.push(k); else if(type==='detached') n.children.push(k); else { n.children.splice(n.attached,0,k); n.attached++; } } }
        break;
    }
  }
  n.summaries=sumRefs.map((s,i)=>({range:s.range,topic:sumTopics.find(tp=>tp.id===s.topicId)||sumTopics[i]||null})).filter(s=>s.range&&s.topic);
  return n;
}
function fromXml(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('content.xml parse error');
  const sheets=[...doc.documentElement.children].filter(e=>e.localName==='sheet');
  return sheets.map((s,i)=>{
    const title=[...s.children].find(e=>e.localName==='title');
    const topic=[...s.children].find(e=>e.localName==='topic');
    const relsEl=[...s.children].find(e=>e.localName==='relationships');
    const rels=relsEl?[...relsEl.children].filter(r=>r.localName==='relationship').map(r=>({a:r.getAttribute('end1'),b:r.getAttribute('end2'),title:([...r.children].find(x=>x.localName==='title')||{}).textContent||''})):[];
    return {title:title?title.textContent:(t('sheet')+' '+(i+1)),root:topicFromXml(topic,false),rels};
  });
}
function resourceNames(text){ const s=new Set(); const re=/xap:((?:resources|attachments)\/[^"'<>\\\s]+)/g; let m; while((m=re.exec(text))) s.add(m[1]); return [...s]; }
async function loadBuffer(buf,name){
  const zip=await readZip(buf);
  let sheets, text;
  if(zip.has('content.json')){ text=await zip.text('content.json'); sheets=fromJson(text); }
  else if(zip.has('content.xml')){ text=await zip.text('content.xml'); sheets=fromXml(text); }
  else if(zip.has('manifest.json')&&/encrypt|password/i.test(await zip.text('manifest.json'))) throw new Error(t('errEnc'));
  else throw new Error(t('errNoContent'));
  const res={};
  for(const r of resourceNames(text)){ if(zip.has(r)){ try{ res[r]=await toDataUrl(await zip.bytes(r),r); }catch(e){} } }
  setData(sheets,name,await prepareRes(res));
}
async function loadFile(file){
  errEl.textContent='';
  try{ await loadBuffer(await file.arrayBuffer(),file.name); }
  catch(e){ errEl.textContent=t('errFail')+(e.message||e); emptyEl.classList.remove('hidden'); }
}

function walk(n,f,d){ d=d||0; f(n,d); n.children.forEach(c=>walk(c,f,d+1)); (n.summaries||[]).forEach(s=>{ if(s.topic) walk(s.topic,f,d+1); }); }

/* ================= 布局与绘制 ================= */
const MARK=(id)=>{ if(!id) return null; let m; if((m=/^priority-(\d)/.exec(id))) return {txt:m[1],cls:'p'}; if(/^flag-/.test(id)) return {txt:'⚑'}; if(/^star-/.test(id)) return {txt:'★'}; if(/^task-done|task-100/.test(id)) return {txt:'✓'}; if(/^task-/.test(id)) return {txt:'◔'}; if(/^smiley-/.test(id)) return {txt:'☺'}; if(/question/.test(id)) return {txt:'?'}; if(/exclam|warning|attention/.test(id)) return {txt:'!'}; if(/^arrow-/.test(id)) return {txt:'➜'}; if(/^month-|^week-|^c_/.test(id)) return null; return {txt:'•'}; };
/* 结构类型 → 布局。布局值表示"该节点的子节点如何排列" */
function layoutOf(sc){
  if(!sc) return null; sc=String(sc);
  if(/logic\.right|fishbone/.test(sc)) return 'right'; if(/logic\.left/.test(sc)) return 'left';
  if(/tree\.right|timeline\.vertical|spreadsheet/.test(sc)) return 'treeRight'; if(/tree\.left/.test(sc)) return 'treeLeft';
  if(/org-chart\.down|timeline\.horizontal/.test(sc)) return 'down'; if(/org-chart\.up/.test(sc)) return 'up';
  if(/\.map/.test(sc)) return 'map'; return null;
}
function assignLayouts(n,inherited,side,isRoot){
  const own=layoutOf(n.structure);

  if(!isRoot&&n.layout==='map') n.layout=side||'right';
  const att=n.children.filter(c=>!c.floating), half=Math.ceil(att.length/2);
  n.children.forEach(c=>{ c.side=n.layout==='map'?(c.floating?'left':(att.indexOf(c)<half?'right':'left')):null; c.edge=n.layout==='map'?c.side:n.layout; assignLayouts(c,n.layout,c.side,false); });

}
const lineStyle=n=>n.depth>=2&&!n.floating&&!n.isSummary&&n.edge!=='down'&&n.edge!=='up';
function buildNode(n,depth,color){

  const vert=edge==='down'||edge==='up';

  if(n.isSummary) cls+=' sum'; else if(lineStyle(n)) cls+=' deep'; else if(depth>=2&&!n.floating&&vert) cls+=' card';

  el.addEventListener('dblclick',e=>{ e.stopPropagation(); if(n===sheet().root) return; focusOn(n); });
  n.el=el; n.color=color; n.depth=depth;

}
function rangeKids(n,range){ if(!range||n.collapsed) return []; const a=Math.max(0,range[0]), b=Math.min(n.attached-1,range[1]); const out=[]; for(let i=a;i<=b;i++) if(n.children[i]) out.push(n.children[i]); return out; }

/* 自底向上计算每个节点的子树包围盒：n.bw/n.bh 尺寸，n.nx/n.ny 节点在盒内位置，子节点 c.bx/c.by 盒内位置 */
function box(n){
  const kids=vis(n); kids.forEach(box);
  const sums=vsums(n); sums.forEach(s=>box(s.topic));
  const L=n.layout, H=CFG.hgap, V=CFG.vgap;
  const stackV=g=>({tw:g.reduce((m,c)=>Math.max(m,c.bw),0),th:g.reduce((s,c)=>s+c.bh,0)+V*Math.max(0,g.length-1)});
  const stackH=g=>({tw:g.reduce((s,c)=>s+c.bw,0)+CFG.hgap2*Math.max(0,g.length-1),th:g.reduce((m,c)=>Math.max(m,c.bh),0)});
  n.nx=0; n.ny=0;
  if(L==='map'){
    const R=kids.filter(c=>c.side==='right'), Lf=kids.filter(c=>c.side==='left');
    const rs=stackV(R), ls=stackV(Lf);
    let y=-rs.th/2; R.forEach(c=>{ c.bx=Math.max(n.w+H-c.nx,n.w+H*.4); c.by=y+n.h/2; y+=c.bh+V; });
    y=-ls.th/2; Lf.forEach(c=>{ c.bx=Math.min(-H-c.nx-c.w,-H*.4-c.bw); c.by=y+n.h/2; y+=c.bh+V; });
  } else if(L==='right'||L==='left'){
    const st=stackV(kids); let y=n.h/2-st.th/2;
    kids.forEach(c=>{ c.bx=L==='right'?Math.max(n.w+H-c.nx,n.w+H*.4):Math.min(-H-c.nx-c.w,-H*.4-c.bw); c.by=y; y+=c.bh+V; });
  } else if(L==='down'||L==='up'){
    const st=stackH(kids); let x=n.w/2-st.tw/2;
    kids.forEach(c=>{ c.bx=x; c.by=L==='down'?n.h+CFG.vgap2:-CFG.vgap2-c.bh; x+=c.bw+CFG.hgap2; });
  } else { // treeRight / treeLeft
    let y=n.h+V;
    kids.forEach(c=>{ c.bx=L==='treeRight'?CFG.indent-c.nx:n.w-CFG.indent-c.nx-c.w; c.by=y; y+=c.bh+V; });
  }
  // 概要：放在范围包围盒外侧
  sums.forEach(s=>{
    const rg=rangeKids(n,s.range); s.placed=false; if(!rg.length) return;
    const x0=Math.min(...rg.map(c=>c.bx)), x1=Math.max(...rg.map(c=>c.bx+c.bw)), y0=Math.min(...rg.map(c=>c.by)), y1=Math.max(...rg.map(c=>c.by+c.bh));
    const tp=s.topic; s.placed=true; s.r={x0,x1,y0,y1};
    const e=n.layout==='map'?'right':n.layout;
    if(e==='left'||e==='treeLeft'){ s.dir='left'; tp.bx=x0-CFG.sgap-tp.bw; tp.by=(y0+y1)/2-tp.bh/2; }
    else if(e==='down'){ s.dir='down'; tp.bx=(x0+x1)/2-tp.bw/2; tp.by=y1+CFG.sgap; }
    else if(e==='up'){ s.dir='up'; tp.bx=(x0+x1)/2-tp.bw/2; tp.by=y0-CFG.sgap-tp.bh; }
    else { s.dir='right'; tp.bx=x1+CFG.sgap; tp.by=(y0+y1)/2-tp.bh/2; }
  });
  // 归一化：让盒子左上角为 (0,0)
  let minX=0,minY=0,maxX=n.w,maxY=n.h;
  const items=kids.concat(sums.filter(s=>s.placed).map(s=>s.topic));
  items.forEach(c=>{ minX=Math.min(minX,c.bx); minY=Math.min(minY,c.by); maxX=Math.max(maxX,c.bx+c.bw); maxY=Math.max(maxY,c.by+c.bh); });
  n.nx=-minX; n.ny=-minY; items.forEach(c=>{ c.bx-=minX; c.by-=minY; });
  sums.forEach(s=>{ if(s.placed){ s.r.x0-=minX; s.r.x1-=minX; s.r.y0-=minY; s.r.y1-=minY; } });
  n.bw=maxX-minX; n.bh=maxY-minY;
}
function placeAbs(n,X,Y){
  n.x=X+n.nx; n.y=Y+n.ny; n.ax=X; n.ay=Y;
  vis(n).forEach(c=>placeAbs(c,X+c.bx,Y+c.by));
  vsums(n).forEach(s=>{ if(s.placed) placeAbs(s.topic,X+s.topic.bx,Y+s.topic.by); });
}
function anchorOut(p,e){ const y=lineStyle(p)?p.y+p.h-1:p.y+p.h/2; return [e==='right'?p.x+p.w:p.x,y]; }
function anchorIn(c,e){ const y=lineStyle(c)?c.y+c.h-1:c.y+c.h/2; return [e==='right'?c.x:c.x+c.w,y]; }
function connectorPath(p,c){

  if(e==='right'||e==='left'){ const [x1,y1]=anchorOut(p,e),[x2,y2]=anchorIn(c,e); const mx=(x1+x2)/2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; }

function bracketPath(s,X,Y){

    const y0=Y+r.y0, y1=Y+r.y1, mid=(y0+y1)/2, sg=s.dir==='right'?1:-1, x=X+(s.dir==='right'?r.x1:r.x0)+sg*6, x2=x+sg*k, tip=x2+sg*k;
    const ex=s.dir==='right'?tp.x:tp.x+tp.w;
    return `M${x},${y0} Q${x2},${y0} ${x2},${y0+k} V${mid-k} Q${x2},${mid} ${tip},${mid} Q${x2},${mid} ${x2},${mid+k} V${y1-k} Q${x2},${y1} ${x},${y1} M${tip},${mid} H${ex}`;
  }
  const x0=X+r.x0, x1=X+r.x1, mid=(x0+x1)/2, sg=s.dir==='down'?1:-1, y=Y+(s.dir==='down'?r.y1:r.y0)+sg*6, y2=y+sg*k, tip=y2+sg*k;

}
function render(fit){
  if(!state.sheets.length) return;
  assignLayouts(sheet().root,null,null,true);
  const r=root(); nodesEl.innerHTML=''; links.innerHTML=''; rels.innerHTML=''; $('#decor').innerHTML='';
  const all=[], byId={};
  const NS='http://www.w3.org/2000/svg';
  let ci=0;
  const build=(n,d,col)=>{ nodesEl.appendChild(buildNode(n,d,col)); all.push(n); vis(n).forEach(c=>build(c,d+1,d===0?ci++:col)); vsums(n).forEach(s=>build(s.topic,d+1,d===0?ci++:col)); };
  if(state.focus){ r.edge=null; }

  all.forEach(n=>{ n.w=n.el.offsetWidth; n.h=n.el.offsetHeight; if(n.id) byId[n.id]=n; });
  box(r); placeAbs(r,-r.nx-r.w/2,-r.ny-r.h/2);

    vis(p).forEach(c=>{ const path=document.createElementNS(NS,'path'); path.setAttribute('d',connectorPath(p,c)); path.setAttribute('stroke','var(--c'+(c.color%COLORS)+')'); if(c.floating) path.classList.add('floating'); links.appendChild(path); });

      const col='var(--c'+(rg[0].color%COLORS)+')';
      const rc=document.createElementNS(NS,'rect'); rc.setAttribute('class','bd'); rc.setAttribute('x',x0); rc.setAttribute('y',y0); rc.setAttribute('width',x1-x0); rc.setAttribute('height',y1-y0); rc.setAttribute('rx',10); rc.setAttribute('fill',col); rc.setAttribute('stroke',col); decor.appendChild(rc);
      if(b.title){ const tx=document.createElementNS(NS,'text'); tx.setAttribute('class','bdt'); tx.setAttribute('x',x0+10); tx.setAttribute('y',y0-5); tx.setAttribute('fill',col); tx.textContent=b.title; decor.appendChild(tx); }

  });

  state.bbox=all.reduce((b,n)=>({x0:Math.min(b.x0,n.x),y0:Math.min(b.y0,n.y),x1:Math.max(b.x1,n.x+n.w),y1:Math.max(b.y1,n.y+n.h)}),{x0:1e9,y0:1e9,x1:-1e9,y1:-1e9});

function updateStat(){ if(!state.sheets.length){ $('#stat').textContent=''; return; } $('#stat').textContent=t('nodes',{v:countVis(root()),t:countAll(sheet().root)}); }
function applyT(){ canvas.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.scale})`; $('#pct').textContent=Math.round(state.scale*100)+'%'; }
function fitView(){

  state.tx=W/2-((b.x0+b.x1)/2)*state.scale; state.ty=H/2-((b.y0+b.y1)/2)*state.scale; applyT();

function zoomAt(f,cx,cy){ const ns=Math.max(CFG.minScale,Math.min(CFG.maxScale,state.scale*f)); state.tx=cx-(cx-state.tx)*(ns/state.scale); state.ty=cy-(cy-state.ty)*(ns/state.scale); state.scale=ns; applyT(); }
function centerOn(n,force){

  state.tx=W/2-(n.x+n.w/2)*state.scale; state.ty=H/2-(n.y+n.h/2)*state.scale; applyT();

/* ================= 选择 / 聚焦 / 层级 ================= */
function select(n){ if(state.sel&&state.sel.el) state.sel.el.classList.remove('sel'); state.sel=n; if(n&&n.el) n.el.classList.add('sel'); }
function focusOn(n){ state.focus=n; state.sel=null; render(true); }
function exitFocus(){ if(!state.focus) return; const f=state.focus; state.focus=null; render(true); select(f); }
function setLevel(L){ state.level=L; const r=sheet().root; walk(r,(n,d)=>{ n.collapsed=L?(d>=L&&n.children.length>0):false; }); buildMenus(); render(true); }
function parentOf(target){ let res=null; (function w(n){ for(const c of n.children){ if(c===target){ res=n; return true; } if(w(c)) return true; } for(const s of (n.summaries||[])){ if(s.topic===target){ res=n; return true; } if(s.topic&&w(s.topic)) return true; } return false; })(sheet().root); return res; }
function moveSel(key){
  const n=state.sel||root(); if(!state.sel){ select(n); centerOn(n); return; }
  const r=root(); let nx=null;
  const mid=a=>a[Math.floor((a.length-1)/2)]||null;
  const toChild=()=>{ if(n.collapsed&&n.children.length){ n.collapsed=false; render(false); } nx=mid(vis(n)); };
  const toParent=()=>{ if(n!==r) nx=parentOf(n); };
  const sib=d=>{ const p=parentOf(n); if(!p) return; const g=vis(p).filter(c=>c.edge===n.edge); const i=g.indexOf(n); nx=g[i+d]||null; };
  if(n===r){ const want={ArrowRight:'right',ArrowLeft:'left',ArrowDown:'down',ArrowUp:'up'}[key]; let g=vis(r).filter(c=>c.edge===want); if(!g.length&&(key==='ArrowRight'||key==='ArrowDown')) g=vis(r).filter(c=>c.edge==='treeRight'); if(!g.length&&key==='ArrowLeft') g=vis(r).filter(c=>c.edge==='treeLeft'); nx=mid(g); }
  else {
    const e=n.edge, horiz=e==='right'||e==='left'||e==='treeRight'||e==='treeLeft';
    const fwd=(e==='right'||e==='treeRight')?'ArrowRight':e==='left'||e==='treeLeft'?'ArrowLeft':e==='down'?'ArrowDown':'ArrowUp';
    const back={ArrowRight:'ArrowLeft',ArrowLeft:'ArrowRight',ArrowDown:'ArrowUp',ArrowUp:'ArrowDown'}[fwd];

  }

}

/* ================= 搜索 ================= */
const qEl=$('#q');
function runSearch(q){
  state.q=q; const r=sheet().root; const hits=[];
  walk(r,n=>{ n.hit=false; });
  if(q){ const lq=q.toLowerCase(); walk(r,n=>{ if((n.title||'').toLowerCase().includes(lq)||(n.notes||'').toLowerCase().includes(lq)){ n.hit=true; hits.push(n); } });
    // 展开命中节点的祖先
    (function w(n,path){ if(n.hit) path.forEach(p=>p.collapsed=false); n.children.forEach(c=>w(c,path.concat(n))); })(r,[]);
    if(state.focus&&!hits.some(h=>isUnder(h,state.focus))) state.focus=null;
  }
  state.hits=hits; state.hitIdx=hits.length?0:-1;
  render(false); if(hits.length) centerOn(hits[0]); updateCnt();
}
function isUnder(n,anc){ let ok=false; walk(anc,x=>{ if(x===n) ok=true; }); return ok; }

function updateCnt(){ $('#qcnt').textContent=state.q?(state.hits.length?t('matches',{i:state.hitIdx+1,n:state.hits.length}):t('noMatch')):''; }
function clearSearch(rerender){ qEl.value=''; state.q=''; state.hits=[]; state.hitIdx=-1; if(state.sheets.length) walk(sheet().root,n=>{ n.hit=false; }); updateCnt(); if(rerender) render(false); }
let qTimer; qEl.addEventListener('input',()=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>runSearch(qEl.value.trim()),120); });
qEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); stepHit(e.shiftKey?-1:1); } else if(e.key==='Escape'){ clearSearch(true); qEl.blur(); } });

/* ================= 交互 ================= */
let pan=null, moved=false;
stage.addEventListener('pointerdown',e=>{ if(e.button!==0||e.target.closest('.node,.hud,.help-btn,.coach,.focusbar,#detail,#outline,#empty,#help')) return; pan={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty}; moved=false; stage.classList.add('panning'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove',e=>{ if(!pan) return; state.tx=pan.tx+e.clientX-pan.x; state.ty=pan.ty+e.clientY-pan.y; if(Math.abs(e.clientX-pan.x)+Math.abs(e.clientY-pan.y)>3) moved=true; applyT(); });
stage.addEventListener('pointerup',()=>{ if(pan&&!moved){ select(null); $('#detail').classList.remove('show'); } pan=null; stage.classList.remove('panning'); });
stage.addEventListener('wheel',e=>{
  if(state.mode!=='map'||!state.sheets.length||e.target.closest('#detail,#help')) return;
  e.preventDefault(); const r=stage.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey) zoomAt(Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top);

// 触摸双指缩放
let pinch=null;
stage.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),s:state.scale}; } },{passive:true});
stage.addEventListener('touchmove',e=>{ if(pinch&&e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); const r=stage.getBoundingClientRect(); const cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top; zoomAt((pinch.s*d/pinch.d)/state.scale,cx,cy); } },{passive:true});
stage.addEventListener('touchend',()=>{ pinch=null; });
$('#zIn').onclick=()=>zoomAt(1.2,stage.clientWidth/2,stage.clientHeight/2);
$('#zOut').onclick=()=>zoomAt(1/1.2,stage.clientWidth/2,stage.clientHeight/2);

function showDetail(n){ $('#dTitle').textContent=n.title; const d=$('#dNotes'); d.innerHTML=''; if(n.notesEl){ const c=n.notesEl.cloneNode(true); c.querySelectorAll('img[data-res]').forEach(im=>{ const r=state.res[im.dataset.res]; if(r) im.src=r.src; else im.remove(); }); d.appendChild(c); d.classList.add('rich'); } else { d.textContent=n.notes; d.classList.remove('rich'); } $('#detail').classList.add('show'); }
$('#dClose').onclick=()=>$('#detail').classList.remove('show');
$('#helpBtn').onclick=()=>$('#help').classList.add('show');
$('#helpClose').onclick=()=>$('#help').classList.remove('show');

document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.v));
function setMode(m){
  state.mode=m; document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active',b.dataset.v===m));
  $('#outline').classList.toggle('show',m==='outline'); $('.hud').style.display=m==='map'?'':'none'; $('#detail').classList.remove('show');
  if(m==='outline') renderOutline(); buildMenus();
}
function showCoach(){ try{ if(localStorage.getItem('ml.coach')) return; }catch(e){} $('#coach').classList.add('show'); }
$('#coachOk').onclick=()=>{ $('#coach').classList.remove('show'); try{ localStorage.setItem('ml.coach','1'); }catch(e){} };

document.addEventListener('keydown',e=>{
  const inInput=!!(e.target&&e.target.matches&&e.target.matches('input,textarea,select'));
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); qEl.focus(); qEl.select(); return; }
  if(e.key==='Escape'){ if($('#help').classList.contains('show')) return $('#help').classList.remove('show'); if(document.querySelector('.menu.open')) return closeMenus(); if($('#detail').classList.contains('show')) return $('#detail').classList.remove('show'); if(state.q) return clearSearch(true); if(state.sel) return select(null); if(state.focus) return exitFocus(); return; }
  if(inInput||e.metaKey||e.ctrlKey||e.altKey) return;
  if(!state.sheets.length) return;
  switch(e.key){
    case '/': e.preventDefault(); qEl.focus(); break;
    case '?': $('#help').classList.toggle('show'); break;
    case '+': case '=': zoomAt(1.2,stage.clientWidth/2,stage.clientHeight/2); break;
    case '-': case '_': zoomAt(1/1.2,stage.clientWidth/2,stage.clientHeight/2); break;
    case '0': case 'f': case 'F': fitView(); break;
    case '1': case '2': case '3': setLevel(+e.key); break;
    case 'a': case 'A': setLevel(0); break;
    case 'o': case 'O': setMode(state.mode==='map'?'outline':'map'); break;
    case ' ': case 'Enter': if(state.sel&&state.sel.children.length){ e.preventDefault(); state.sel.collapsed=!state.sel.collapsed; render(false); } break;
    case 'ArrowUp': case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight': if(state.mode==='map'){ e.preventDefault(); moveSel(e.key); } break;
  }
});

/* ================= 大纲 ================= */
function renderOutline(){
  const o=$('#outline .wrap'); o.innerHTML=''; const ul=document.createElement('ul'); const lq=state.q.toLowerCase();
  const mark=(text)=>{ const s=document.createElement('span'); if(!lq||!text.toLowerCase().includes(lq)){ s.textContent=text; return s; } let i=0, idx; const lt=text.toLowerCase(); while((idx=lt.indexOf(lq,i))>=0){ s.appendChild(document.createTextNode(text.slice(i,idx))); const m=document.createElement('mark'); m.textContent=text.slice(idx,idx+lq.length); s.appendChild(m); i=idx+lq.length; } s.appendChild(document.createTextNode(text.slice(i))); return s; };
  (function build(n,parent,d){
    const li=document.createElement('li');
    if(n.children.length){
      const det=document.createElement('details'); det.open=!n.collapsed; det.className='d'+Math.min(d,2);
      const s=document.createElement('summary'); s.appendChild(mark(n.title||t('empty'))); det.appendChild(s);
      if(n.notes){ const p=document.createElement('div'); p.className='note'; p.textContent=n.notes; det.appendChild(p); }
      const cu=document.createElement('ul'); n.children.forEach(c=>build(c,cu,d+1)); det.appendChild(cu); li.appendChild(det);
      det.addEventListener('toggle',()=>{ n.collapsed=!det.open; });
    } else {
      const s=document.createElement('span'); s.className='leaf'; s.appendChild(mark(n.title||t('empty'))); li.appendChild(s);
      if(n.notes){ const p=document.createElement('div'); p.className='note'; p.textContent=n.notes; li.appendChild(p); }
    }
    parent.appendChild(li);
  })(sheet().root,ul,0);
  o.appendChild(ul);
}

/* ================= 导出 ================= */
function toMarkdown(){
  const lines=[];
  state.sheets.forEach((s,i)=>{
    if(state.sheets.length>1) lines.push('# '+s.title,'');
    (function w(n,d){ lines.push('  '.repeat(d)+'- '+(n.title||'').replace(/\s*\n\s*/g,' ')+(n.labels&&n.labels.length?' `'+n.labels.join('` `')+'`':'')); if(n.notes) n.notes.split('\n').forEach(l=>lines.push('  '.repeat(d+1)+'> '+l)); n.children.forEach(c=>w(c,d+1)); })(s.root,0);
    lines.push('');
  });
  return lines.join('\n');
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }
function baseName(){ return (state.name||'mindmap').replace(/\.xmind$/i,''); }
function download(blob,fname){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast(t('downloaded',{f:fname})); }
async function copyMarkdown(){ if(!state.sheets.length) return; const md=toMarkdown(); try{ await navigator.clipboard.writeText(md); }catch(e){ const ta=document.createElement('textarea'); ta.value=md; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } toast(t('copied')); }
function downloadMarkdown(){ if(!state.sheets.length) return; download(new Blob([toMarkdown()],{type:'text/markdown;charset=utf-8'}),baseName()+'.md'); }
function buildSvg(){
  const b=state.bbox, pad=40, W=Math.ceil(b.x1-b.x0+pad*2), H=Math.ceil(b.y1-b.y0+pad*2);
  const css=document.querySelector('style').textContent;
  const clone=canvas.cloneNode(true); clone.style.transform=`translate(${pad-b.x0}px,${pad-b.y0}px)`;
  clone.querySelectorAll('.sel,.hit').forEach(e=>e.classList.remove('sel','hit','cur'));
  const theme=document.documentElement.dataset.theme?` data-theme="${document.documentElement.dataset.theme}"`:'';
  const html=new XMLSerializer().serializeToString(clone);
  return {W,H,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"${theme}><foreignObject width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:${W}px;height:${H}px;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,'SF Pro Text','PingFang SC','Segoe UI','Microsoft YaHei',Roboto,sans-serif;overflow:hidden"><style>${css.replace(/]]>/g,'')}</style>${html}</div></foreignObject></svg>`};
}
async function exportImage(kind){
  if(!state.sheets.length) return;
  if(state.mode!=='map') setMode('map');
  const {W,H,svg}=buildSvg();
  if(kind==='svg') return download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),baseName()+'.svg');
  try{
    const img=new Image(); const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
    const k=Math.min(2,8000/Math.max(W,H)); const c=document.createElement('canvas'); c.width=Math.round(W*k); c.height=Math.round(H*k);
    const ctx=c.getContext('2d'); ctx.scale(k,k); ctx.drawImage(img,0,0);
    const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob failed')),'image/png'));
    download(blob,baseName()+'.png');
  }catch(e){ toast(t('pngFail')); download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),baseName()+'.svg'); }
}
