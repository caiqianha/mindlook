<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; img-src 'self' data: blob:; worker-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindlook · 思维导图查看器</title>
<meta name="description" content="不装软件也能查看 .xmind、FreeMind .mm、OPML、Markdown 思维导图。文件只在浏览器本地解析，不上传。 Mind map viewer for .xmind, .mm, .opml, Markdown.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191d23" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1b1f24; --muted:#626b78; --line:#dfe3e8; --soft:#eef0f3;
  --paper:#ffffff; --accent:#2f6fed; --hit:#ffd54a; --hit-ink:#5b4300;
  --shadow:0 1px 2px rgba(16,24,40,.08),0 4px 14px rgba(16,24,40,.06);
  --c0:#2f6fed; --c1:#0b8259; --c2:#a85f12; --c3:#cf3b48; --c4:#7b4fe0; --c5:#0a7d99; --c6:#c23f90; --c7:#597d0a;
  --on-branch:#ffffff;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --panel:#191d23; --ink:#e8eaed; --muted:#98a2ad; --line:#2a3039; --soft:#20252c;
    --paper:#111418; --accent:#6b9cff; --hit:#f2c94c; --hit-ink:#2b2000;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
    --c0:#6b9cff; --c1:#3ccf9a; --c2:#f5a34a; --c3:#ff6b76; --c4:#a98bff; --c5:#3fc3e3; --c6:#f07ac0; --c7:#a6d43c;
    --on-branch:#111418;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#191d23; --ink:#e8eaed; --muted:#98a2ad; --line:#2a3039; --soft:#20252c;
  --paper:#111418; --accent:#6b9cff; --hit:#f2c94c; --hit-ink:#2b2000;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
  --c0:#6b9cff; --c1:#3ccf9a; --c2:#f5a34a; --c3:#ff6b76; --c4:#a98bff; --c5:#3fc3e3; --c6:#f07ac0; --c7:#a6d43c;
    --on-branch:#111418;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"SF Pro Text","PingFang SC","Segoe UI","Microsoft YaHei",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- 顶栏 ---- */
.bar{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em;padding-right:10px;border-right:1px solid var(--line);height:28px}
.brand .logo{width:22px;height:22px}
.file{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow:hidden}
.file .fname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:32vw}
.tabs{display:flex;gap:2px;overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:3px 10px;border-radius:999px;color:var(--muted);white-space:nowrap}
.tabs button:hover{background:var(--soft);color:var(--ink)}
.tabs button.active{background:var(--ink);color:var(--paper)}
.tools{display:flex;align-items:center;gap:4px;flex:none}
.search{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:8px;padding:0 8px;height:30px;color:var(--muted);width:200px;transition:width .15s}
.search:focus-within{width:260px;background:var(--panel);box-shadow:0 0 0 2px var(--accent)}
.search input{border:0;background:none;color:var(--ink);font:inherit;min-width:0;flex:1;height:100%}
.search input::placeholder{color:var(--muted)}
.search .cnt{font-size:12px;white-space:nowrap}
.search kbd{font:11px/1 inherit;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 8px;border-radius:8px;color:var(--muted)}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.active{background:var(--soft);color:var(--ink)}
.ib.primary{background:var(--ink);color:var(--paper);padding:0 12px}
.ib.primary:hover{opacity:.9;color:var(--paper)}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;color:var(--muted);font-size:13px}
.seg button.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:36px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;display:none;z-index:20}
.menu.open .pop{display:block}
.pop button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:6px;text-align:left;font-size:13px}
.pop button:hover,.pop button:focus-visible{background:var(--soft);outline:none}
.pop .sep{height:1px;background:var(--line);margin:4px 0}
.pop .lab{font-size:11px;color:var(--muted);padding:4px 10px 2px}
.pop button.on::after{content:"✓";margin-left:auto;color:var(--accent)}
.only-sm{display:none}

/* ---- 舞台 ---- */
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none}
#stage.panning{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#links,#rels,#decor{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#decor .bd{fill-opacity:.07;stroke-width:1.5;stroke-dasharray:6 4}
#decor .bdt{font-size:12px;font-weight:500}
#decor .br{fill:none;stroke-width:1.5}
#links path{fill:none;stroke-width:2;stroke-linecap:round}
#links path.floating{stroke-dasharray:5 5}
#rels path{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4}
#rels text{font-size:11px;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
#nodes{position:absolute;left:0;top:0}
.node{position:absolute;width:max-content;max-width:300px;padding:7px 12px;border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word;user-select:none;cursor:default;line-height:1.4}
.node.d0{background:var(--ink);color:var(--paper);font-size:17px;font-weight:600;padding:11px 20px;border-radius:14px;max-width:340px;box-shadow:none}
.node.d1{background:var(--branch);color:var(--on-branch);font-weight:500;box-shadow:none}
.node.deep{background:none;box-shadow:none;border-radius:0;padding:3px 8px 4px;border-bottom:2px solid var(--branch)}
.node.card{background:var(--panel);box-shadow:none;border:1px solid var(--line);border-left:3px solid var(--branch)}
.node.sum{background:var(--panel);box-shadow:none;border:1.5px solid var(--branch);color:var(--ink);font-weight:400}
.node.floating{border:1.5px dashed var(--branch);background:var(--panel);color:var(--ink);font-weight:400;box-shadow:none}
.node.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.node.hit{background:var(--hit);color:var(--hit-ink);box-shadow:0 0 0 2px var(--hit)}
.node.hit.cur{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--hit-ink)}
.node .lbl{display:block;font-size:11px;opacity:.75;margin-top:1px}
.node .mk{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:rgba(127,127,127,.18);font-size:11px;font-weight:600;margin-right:4px;vertical-align:-3px}
.node .mk.p{background:var(--c3);color:var(--on-branch)}
.node .nt{display:inline-block;margin-left:6px;font-size:12px;opacity:.75}
.node img{display:block;border-radius:6px;margin-bottom:6px}
.node a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.node .tg{position:absolute;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--panel);color:var(--ink);border:1.5px solid var(--branch);font-size:11px;line-height:15px;text-align:center;cursor:pointer;z-index:1}
.node .tg.r{right:-11px}.node .tg.l{left:-11px}
.node .tg.b,.node .tg.t{left:50%;transform:translateX(-50%)}.node .tg.b{top:auto;bottom:-11px}.node .tg.t{top:-11px}
.node .tg:hover{background:var(--branch);color:var(--on-branch)}
.node.has-notes{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---- HUD ---- */
.hud{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;z-index:4}
.hud .grp{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);height:32px;overflow:hidden}
.hud .grp button{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.hud .grp button:hover{background:var(--soft);color:var(--ink)}
.hud .pct{min-width:48px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud .stat{font-size:12px;color:var(--muted)}
.help-btn{position:absolute;right:12px;bottom:12px;z-index:4;width:32px;height:32px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.help-btn:hover{color:var(--ink)}
.focusbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:5px 6px 5px 14px;display:none;align-items:center;gap:10px;font-size:13px;z-index:4;max-width:calc(100% - 24px)}
.focusbar.show{display:flex}
.focusbar b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focusbar button{border-radius:999px;padding:3px 10px;background:var(--soft);font-size:12px}
.coach{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 16px;font-size:13px;display:none;align-items:center;gap:12px;z-index:6;max-width:calc(100% - 200px);box-shadow:var(--shadow)}
.coach.show{display:flex}
.coach button{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
:root[data-theme="dark"] .coach button,:root:not([data-theme="light"]) .coach button{background:rgba(0,0,0,.15)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
#busy{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:999px;font-size:13px;display:none;align-items:center;gap:8px;z-index:31}
#busy.show{display:flex}
#busy::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:ml-spin .8s linear infinite}
@keyframes ml-spin{to{transform:rotate(360deg)}}

/* ---- 备注面板 ---- */
#detail{position:absolute;right:12px;bottom:56px;width:min(400px,calc(100% - 24px));max-height:45%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:none;z-index:5}
#detail.show{display:block}
#detail h3{margin:0 24px 6px 0;font-size:14px}
#detail .notes{font-size:13px;line-height:1.6;color:var(--muted);white-space:pre-wrap}
#detail .notes.rich{white-space:normal}
#detail .notes p{margin:0 0 6px}#detail .notes ul,#detail .notes ol{margin:4px 0;padding-left:20px}#detail .notes a{color:var(--accent)}#detail .notes img{max-width:100%;border-radius:6px;display:block;margin:6px 0}#detail .notes code,#detail .notes pre{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:4px;padding:1px 4px}#detail .notes pre{padding:8px;overflow:auto}#detail .notes blockquote{margin:4px 0;padding-left:10px;border-left:2px solid var(--line)}#detail .notes h1,#detail .notes h2,#detail .notes h3{font-size:14px;margin:8px 0 4px;color:var(--ink)}
#detail .x{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:6px;color:var(--muted)}
#detail .x:hover{background:var(--soft)}

/* ---- 大纲 ---- */
#outline{position:absolute;inset:0;overflow:auto;padding:24px 32px 80px;display:none;background:var(--bg);cursor:auto}
#outline.show{display:block}
#outline .wrap{max-width:760px;margin:0 auto}
#outline ul{list-style:none;padding-left:22px;margin:0;border-left:1px solid var(--line)}
#outline > .wrap > ul{padding-left:0;border:0}
#outline li{margin:4px 0;position:relative}
#outline summary{cursor:pointer;list-style:none;display:inline-block;padding:2px 6px;border-radius:5px}
#outline summary::-webkit-details-marker{display:none}
#outline summary:hover{background:var(--soft)}
#outline summary::before{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin:0 10px 2px 2px;transition:transform .12s}
#outline details[open]>summary::before{transform:rotate(45deg)}
#outline .leaf{padding:2px 6px;display:inline-block}
#outline .leaf::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 11px 2px 2px}
#outline .d0>summary{font-size:20px;font-weight:600;padding:4px 6px}
#outline .d1>summary,#outline .d1 .leaf{font-weight:500}
#outline .note{color:var(--muted);font-size:12.5px;margin:2px 0 4px 28px;white-space:pre-wrap;border-left:2px solid var(--line);padding-left:8px}
#outline mark{background:var(--hit);color:var(--hit-ink);border-radius:2px}

/* ---- 空状态 ---- */
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:8;cursor:auto;padding:16px}
#empty.hidden{display:none}
#empty .box{width:min(560px,100%);padding:40px 32px;border:1.5px dashed var(--line);border-radius:20px;background:var(--panel);text-align:center;transition:border-color .15s,background .15s}
body.dragging #empty{display:flex;background:var(--bg)}
body.dragging #empty .box{border-color:var(--accent);background:var(--soft)}
#empty .mark{width:64px;height:64px;margin:0 auto 18px}
#empty h1{font-size:22px;margin:0 0 8px;font-weight:600}
#empty p{color:var(--muted);margin:6px 0;font-size:14px}
#empty .act{display:flex;gap:8px;justify-content:center;margin:18px 0 8px;flex-wrap:wrap}
#empty .act .ib{height:36px;padding:0 16px;border-radius:9px}
#empty .act .ib.ghost{border:1px solid var(--line);color:var(--ink)}
#empty code{display:block;background:var(--soft);padding:10px 12px;border-radius:8px;margin-top:8px;text-align:left;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;user-select:all;color:var(--ink)}
#empty .err{color:var(--c3);margin-top:12px;font-size:13px;white-space:pre-wrap}
#empty .install{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:13px}
#empty .install .ib{height:30px;padding:0 12px;font-size:13px}
#empty details{margin-top:14px;color:var(--muted);font-size:13px}
#empty summary{cursor:pointer}

/* ---- 帮助 ---- */
#help{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40;cursor:auto;padding:16px}
#help.show{display:flex}
#help .card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90%;overflow:auto;padding:22px 24px;position:relative}
#help h2{margin:0 0 14px;font-size:17px}
#help table{width:100%;border-collapse:collapse;font-size:13.5px}
#help td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
#help td:first-child{width:46%;color:var(--muted)}
#help kbd{display:inline-block;font:12px/1 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;margin:0 2px;background:var(--soft);color:var(--ink)}
#help .x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:7px;color:var(--muted)}
#help .x:hover{background:var(--soft)}
#help .foot{margin-top:14px;font-size:12.5px;color:var(--muted)}
#pw{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:45;cursor:auto;padding:16px}
#pw.show{display:flex}
#pw .card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(400px,100%);padding:22px 24px}
#pw h2{margin:0 0 4px;font-size:17px}
#pw .f{color:var(--muted);font-size:13px;margin:0 0 12px;word-break:break-all}
#pw .hint{font-size:13px;margin:0 0 10px;padding:8px 10px;background:var(--soft);border-radius:8px}
#pw input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;background:var(--bg);color:var(--ink)}
#pw input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#pw .err{color:var(--c3);font-size:13px;min-height:18px;margin:8px 0 4px}
#pw .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#pw .row .ib{height:34px;padding:0 14px}
#pw .row .ghost{border:1px solid var(--line)}
#pw .priv{font-size:12px;color:var(--muted);margin:12px 0 0}

@media (max-width:760px){
  .bar{gap:6px;padding:0 8px}
  .brand span{display:none}
  .brand{border:0;padding:0}
  .file .fname{max-width:40vw}
  .search{width:34px;padding:0 9px}
  .search input,.search .cnt,.search kbd{display:none}
  .search:focus-within{width:180px}
  .search:focus-within input{display:block}
  .hide-sm{display:none}
  .only-sm{display:inline-flex}
  .coach{max-width:calc(100% - 24px);bottom:56px}
  .hud .stat{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}#busy::before{animation:none}}
@media print{.bar,.hud,.help-btn,.coach,#detail,#empty{display:none!important}#stage{overflow:visible}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><path d="M15 12h4M5 12h4M14.5 10l3-4M14.5 14l3 4M9.5 10l-3-4M9.5 14l-3 4"/></svg>
    <span>Mindlook</span>
  </div>
  <div class="file"><span class="fname" id="fname"></span><div class="tabs" id="tabs"></div></div>
  <div class="tools">
    <label class="search" id="searchBox" title="">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <span class="cnt" id="qcnt"></span>
      <kbd id="qkbd">⌘K</kbd>
    </label>
    <div class="seg hide-sm" id="viewSeg"><button data-v="map" class="active"></button><button data-v="outline"></button></div>

/* ================= zip 读取（原生，不依赖外部库） ================= */
async function readZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder('utf-8');
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error(t('errNotZip'));
  const count=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true);
  const files={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    files[td.decode(u8.subarray(p+46,p+46+nlen))]={method,csize,lho};
    p+=46+nlen+elen+clen;
  }
  async function bytes(n){
    const f=files[n], q=f.lho;
    if(dv.getUint32(q,true)!==0x04034b50) throw new Error(t('errZipEntry',{n}));
    const start=q+30+dv.getUint16(q+26,true)+dv.getUint16(q+28,true);
    const data=u8.subarray(start,start+f.csize);
    if(f.method===0) return data;
    if(f.method!==8) throw new Error(t('errZipMethod',{m:f.method}));
    if(typeof DecompressionStream==='undefined') throw new Error(t('errOldBrowser'));
    const resp=new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')));
    return new Uint8Array(await resp.arrayBuffer());
  }
  return { has:n=>Object.prototype.hasOwnProperty.call(files,n), bytes, async text(n){ return td.decode(await bytes(n)); } };
}
const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',bmp:'image/bmp'};
function imgSize(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res({src,w:im.naturalWidth||1,h:im.naturalHeight||1}); im.onerror=()=>res(null); im.src=src; }); }
async function prepareRes(map){ const out={}; for(const k in map){ const r=await imgSize(map[k]); if(r) out[k]=r; } return out; }
function toDataUrl(u8,name){ const ext=(name.split('.').pop()||'').toLowerCase(); return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(new Blob([u8],{type:MIME[ext]||'application/octet-stream'})); }); }

/* ================= 解析 ================= */
/* 富文本备注：白名单清洗，可同时处理 HTML DOM 与 XMind 8 的 XHTML 节点 */
const NOTE_TAGS={p:1,br:1,b:1,strong:1,i:1,em:1,u:1,s:1,strike:1,ul:1,ol:1,li:1,a:1,span:1,div:1,h1:1,h2:1,h3:1,h4:1,h5:1,h6:1,blockquote:1,code:1,pre:1,img:1};
function sanitizeInto(src,out){
  for(const c of src.childNodes){
    if(c.nodeType===3){ out.appendChild(document.createTextNode(c.nodeValue)); continue; }
    if(c.nodeType!==1) continue;
    const tag=(c.localName||'').toLowerCase();
    if(/^(script|style|iframe|object|embed|svg|math|template)$/.test(tag)) continue;
    if(!NOTE_TAGS[tag]){ sanitizeInto(c,out); continue; }
    if(tag==='img'){ const s=c.getAttribute('src')||c.getAttribute('xhtml:src')||c.getAttributeNS('http://www.w3.org/1999/xhtml','src')||''; if(/^xap:/.test(s)){ const im=document.createElement('img'); im.alt=''; im.dataset.res=s.replace(/^xap:/,''); out.appendChild(im); } continue; }
    const el=document.createElement(tag==='strike'?'s':tag);
    if(tag==='a'){ const h=c.getAttribute('href')||c.getAttribute('xlink:href')||''; if(/^https?:/i.test(h)){ el.href=h; el.target='_blank'; el.rel='noopener'; } }
    const st=c.getAttribute('style')||''; const keep=[];
    if(/font-weight:\s*(bold|[6-9]00)/i.test(st)) keep.push('font-weight:600');
    if(/font-style:\s*italic/i.test(st)) keep.push('font-style:italic');
    if(/text-decoration[^;]*underline/i.test(st)) keep.push('text-decoration:underline');
    if(/line-through/i.test(st)) keep.push('text-decoration:line-through');
    if(keep.length) el.style.cssText=keep.join(';');
    sanitizeInto(c,el); out.appendChild(el);

async function loadXmind(buf,name){

  if(n===r){ const want={ArrowRight:'right',ArrowLeft:'left',ArrowDown:'down',ArrowUp:'up'}[key]; let g=vis(r).filter(c=>c.edge===want); if(!g.length&&(key==='ArrowRight'||key==='ArrowDown')) g=vis(r).filter(c=>c.edge==='treeRight'); if(!g.length&&key==='ArrowLeft') g=vis(r).filter(c=>c.edge==='treeLeft'); nx=mid(g); }
  else {
    const e=n.edge, horiz=e==='right'||e==='left'||e==='treeRight'||e==='treeLeft';
    const fwd=(e==='right'||e==='treeRight')?'ArrowRight':e==='left'||e==='treeLeft'?'ArrowLeft':e==='down'?'ArrowDown':'ArrowUp';
    const back={ArrowRight:'ArrowLeft',ArrowLeft:'ArrowRight',ArrowDown:'ArrowUp',ArrowUp:'ArrowDown'}[fwd];

const qEl=$('#q');
function runSearch(q){
  state.q=q; const r=sheet().root; const hits=[];
  walk(r,n=>{ n.hit=false; });
  if(q){ const lq=q.toLowerCase(); walk(r,n=>{ if((n.title||'').toLowerCase().includes(lq)||(n.notes||'').toLowerCase().includes(lq)){ n.hit=true; hits.push(n); } });

    (function w(n,path){ if(n.hit) path.forEach(p=>p.collapsed=false); n.children.forEach(c=>w(c,path.concat(n))); })(r,[]);
    if(state.focus&&!hits.some(h=>isUnder(h,state.focus))) state.focus=null;
  }
  state.hits=hits; state.hitIdx=hits.length?0:-1;

}

function renderOutline(){
  const o=$('#outline .wrap'); o.innerHTML=''; const ul=document.createElement('ul'); const lq=state.q.toLowerCase();
  const mark=(text)=>{ const s=document.createElement('span'); if(!lq||!text.toLowerCase().includes(lq)){ s.textContent=text; return s; } let i=0, idx; const lt=text.toLowerCase(); while((idx=lt.indexOf(lq,i))>=0){ s.appendChild(document.createTextNode(text.slice(i,idx))); const m=document.createElement('mark'); m.textContent=text.slice(idx,idx+lq.length); s.appendChild(m); i=idx+lq.length; } s.appendChild(document.createTextNode(text.slice(i))); return s; };

    const li=document.createElement('li');
    if(n.children.length){
      const det=document.createElement('details'); det.open=!n.collapsed; det.className='d'+Math.min(d,2);
      const s=document.createElement('summary'); s.appendChild(mark(n.title||t('empty'))); det.appendChild(s);
      if(n.notes){ const p=document.createElement('div'); p.className='note'; p.textContent=n.notes; det.appendChild(p); }
      const cu=document.createElement('ul'); n.children.forEach(c=>build(c,cu,d+1)); det.appendChild(cu); li.appendChild(det);

    }

  o.appendChild(ul);
}

function tagsOf(n){ return (n.labels||[]).concat((n.markers||[]).map(m=>'#'+m)); }
const oneLine=s=>String(s||'').replace(/\s*\n\s*/g,' ').trim();
function toMarkdown(){
  const s=sheet(); const lines=[];
  (function w(n,d){
    const title=oneLine(n.title)||t('empty'); const tags=tagsOf(n).map(x=>' `'+x+'`').join('');
    lines.push('  '.repeat(d)+'- '+(n.href&&/^https?:/i.test(n.href)?'['+title+']('+n.href+')':title)+tags);
    if(n.notes) n.notes.split('\n').forEach(l=>lines.push('  '.repeat(d+1)+'> '+l));
    n.children.forEach(c=>w(c,d+1)); (n.summaries||[]).forEach(x=>{ if(x.topic) w(x.topic,d+1); });
  })(s.root,0);
  return lines.join('\n')+'\n';
}
function toText(){
  const s=sheet(); const lines=[];
  (function w(n,d){
    const tags=tagsOf(n); lines.push('\t'.repeat(d)+(oneLine(n.title)||t('empty'))+(tags.length?' ['+tags.join(', ')+']':''));
    if(n.notes) n.notes.split('\n').forEach(l=>lines.push('\t'.repeat(d+1)+l));
    n.children.forEach(c=>w(c,d+1)); (n.summaries||[]).forEach(x=>{ if(x.topic) w(x.topic,d+1); });

/* 在"全部展开、无聚焦、1:1 无平移"的状态下执行 fn，之后恢复折叠 / 聚焦 / 视口 */
function withFullTree(fn){
  const opened=[]; walk(sheet().root,n=>{ if(n.collapsed){ opened.push(n); n.collapsed=false; } });
  const focus=state.focus, tx=state.tx, ty=state.ty, sc=state.scale, changed=opened.length>0||!!focus;
  state.focus=null; if(changed) render(false);
  state.tx=0; state.ty=0; state.scale=1; applyT();
  try{ return fn(); }
  finally{ opened.forEach(n=>{ n.collapsed=true; }); state.focus=focus; state.tx=tx; state.ty=ty; state.scale=sc; if(changed) render(false); else applyT(); }
}
const svgEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
/* 把当前画布序列化成不依赖 CSS / 外部资源的纯 SVG：节点为 rect + text（按实际换行逐行输出），连线直接复制路径并写死计算后的颜色 */
function buildSvg(){
  return withFullTree(()=>{
    const b=state.bbox, pad=40, W=Math.ceil(b.x1-b.x0+pad*2), H=Math.ceil(b.y1-b.y0+pad*2);
    const o=canvas.getBoundingClientRect(), ox=pad-b.x0, oy=pad-b.y0;
    const px=x=>+(x-o.left+ox).toFixed(1), py=y=>+(y-o.top+oy).toFixed(1), num=s=>parseFloat(s)||0, r1=v=>+(+v).toFixed(1);
    const alpha=c=>{ const m=/rgba?\(([^)]+)\)/.exec(c||''); if(!m) return c&&c!=='transparent'?1:0; const p=m[1].split(/[\s,\/]+/); return p.length>3?parseFloat(p[3]):1; };

    const out=[];

    const copyLayer=(layer)=>{ const g=[]; for(const ch of layer.children){ const cs=getComputedStyle(ch); const attrs=[]; ['d','x','y','width','height','rx','ry'].forEach(a=>{ if(ch.hasAttribute(a)) attrs.push(a+'="'+svgEsc(ch.getAttribute(a))+'"'); });
      const sty=['fill','stroke','stroke-width','stroke-dasharray','stroke-linecap','fill-opacity'].concat(ch.localName==='text'?['font-size','font-weight','font-family','text-anchor','paint-order']:[]).map(p=>p+':'+cs.getPropertyValue(p)).join(';');
      g.push('<'+ch.localName+' '+attrs.join(' ')+' style="'+svgEsc(sty)+'">'+(ch.localName==='text'?svgEsc(ch.textContent):'')+'</'+ch.localName+'>'); }
      return g.length?'<g transform="translate('+r1(ox)+' '+r1(oy)+')">'+g.join('')+'</g>':''; };

      for(let i=0;i<text.length;i++){ range.setStart(tn,i); range.setEnd(tn,i+1); const rc=range.getClientRects()[0]; if(!rc||!rc.width&&/\s/.test(text[i])) continue;

      const deco=(cs.textDecorationLine||'').includes('underline')?' text-decoration="underline"':'';
      lines.forEach(l=>{ const str=text.slice(l.s,l.e).replace(/^\s+|\s+$/g,''); if(!str) return;
        out.push('<text x="'+px(l.left)+'" y="'+py((l.top+l.bottom)/2)+'" dominant-baseline="central" font-family="'+svgEsc(cs.fontFamily)+'" font-size="'+cs.fontSize+'" font-weight="'+cs.fontWeight+'"'+(cs.fontStyle==='italic'?' font-style="italic"':'')+deco+' fill="'+cs.color+'">'+svgEsc(str)+'</text>'); }); };
    /* 元素：背景 / 边框 → rect 或 line，再递归子节点；img 内嵌为 data: */
    const emitEl=(el)=>{ if(el.classList.contains('tg')) return; /* 折叠按钮是界面控件，导出时全部展开，不画 */ const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') return;
      if(el.localName==='img'){ const r=el.getBoundingClientRect(); if(/^data:/.test(el.src)) out.push('<image x="'+px(r.left)+'" y="'+py(r.top)+'" width="'+r1(r.width)+'" height="'+r1(r.height)+'" href="'+svgEsc(el.src)+'" xlink:href="'+svgEsc(el.src)+'"/>'); return; }
      const r=el.getBoundingClientRect(); if(r.width>0&&r.height>0){
        const x=px(r.left), y=py(r.top), w=r1(r.width), h=r1(r.height), bg=cs.backgroundColor, rx=Math.min(num(cs.borderTopLeftRadius),w/2,h/2);
        const bw={t:num(cs.borderTopWidth),r:num(cs.borderRightWidth),b:num(cs.borderBottomWidth),l:num(cs.borderLeftWidth)};
        const ring=bw.t>0&&bw.t===bw.r&&bw.t===bw.b; const dash=cs.borderTopStyle==='dashed'?' stroke-dasharray="6 4"':'';

        if(bw.l&&(!ring||bw.l!==bw.t)) line(x+bw.l/2,y+(ring?rx:0),x+bw.l/2,y+h-(ring?rx:0),bw.l,cs.borderLeftColor);

      for(const c of el.childNodes){ if(c.nodeType===3) emitText(c); else if(c.nodeType===1) emitEl(c); } };
    const decor=copyLayer($('#decor')), lk=copyLayer(links);
    state.all.forEach(n=>emitEl(n.el));
    const rl=copyLayer(rels);
    const title=oneLine(sheet().root.title);
    return {W,H,svg:'<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="'+svgEsc(bodyCs.fontFamily)+'">'+(title?'<title>'+svgEsc(title)+'</title>':'')+'<rect width="100%" height="100%" fill="'+(rootCs.getPropertyValue('--bg').trim()||bodyCs.backgroundColor)+'"/>'+decor+lk+out.join('')+rl+'</svg>'};
  });
}
/* SVG → PNG：先用 blob: URL 画到 canvas；Safari 可能因此污染 canvas，失败时改用 data: URL 再试 */
async function svgToPng(svg,W,H){
  const k=Math.min(Math.max(2,window.devicePixelRatio||1),8000/Math.max(W,H,1));
  const draw=src=>new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=Math.round(W*k); c.height=Math.round(H*k); const ctx=c.getContext('2d'); ctx.scale(k,k); ctx.drawImage(img,0,0,W,H); c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'); }catch(e){ rej(e); } }; img.onerror=()=>rej(new Error('load')); img.src=src; });
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try{ return await draw(url); }
  catch(e){ return await draw('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)); }
  finally{ URL.revokeObjectURL(url); }
}
async function exportImage(kind){
  if(!state.sheets.length) return;
  if(state.mode!=='map') setMode('map');
  const {W,H,svg}=buildSvg();
  if(kind==='svg') return download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),exportName('svg'));
  try{ download(await svgToPng(svg,W,H),exportName('png')); }
  catch(e){ toast(t('pngFail')); download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),exportName('svg')); }
}

document.addEventListener('drop',e=>{ e.preventDefault(); dragDepth=0; document.body.classList.remove('dragging'); const f=e.dataTransfer.files[0]; if(f) loadFile(f); });
$('#eDemo').onclick=()=>{
  const zh=lang==='zh-CN';
  const T=(a,b)=>zh?a:b;
  const demo=[{title:T('示例','Sample'),rootTopic:{id:'r',title:T('用 Mindlook 阅读思维导图','Reading mind maps with Mindlook'),notes:{plain:{content:T('这是根节点的备注。点击带 📝 的节点就能看到。','Notes on the root topic. Click any topic with 📝 to read them.')}},
    children:{attached:[
      {id:'a',title:T('打开文件','Open a file'),children:{attached:[{id:'a1',title:T('拖进窗口','Drag it in')},{id:'a2',title:T('或点「打开文件」','or click “Open file”')},{id:'a3',title:T('终端：xmindview 路径','Terminal: xmindview path'),labels:['CLI']}]}},
      {id:'b',title:T('浏览','Navigate'),children:{attached:[{id:'b1',title:T('拖动空白处平移','Drag to pan')},{id:'b2',title:T('⌘ + 滚轮缩放','⌘ + wheel to zoom')},{id:'b3',title:T('点圆点折叠分支','Click the dot to collapse'),markers:[{markerId:'priority-1'}]},{id:'b4',title:T('双击节点只看这一支','Double-click to focus a branch')}]}},
      {id:'c',title:T('查找','Find'),children:{attached:[{id:'c1',title:T('⌘K 搜索，Enter 跳到下一个','⌘K to search, Enter for next')},{id:'c2',title:T('方向键在节点间移动','Arrow keys move between topics')}]}},
      {id:'d',title:T('导出','Export'),children:{attached:[{id:'d1',title:T('Markdown / 文本大纲','Markdown / text outline')},{id:'d2',title:'PNG / SVG'}]}},
      {id:'g',title:T('也能打开','Also opens'),children:{attached:[{id:'g1',title:'FreeMind / Freeplane .mm'},{id:'g2',title:'OPML'},{id:'g3',title:T('Markdown 与文本大纲','Markdown & text outlines')}]}},
      {id:'e',title:T('隐私','Privacy'),children:{attached:[{id:'e1',title:T('文件只在浏览器里解析','Parsed in your browser only'),markers:[{markerId:'flag-green'}]},{id:'e2',title:T('不上传、不联网','No upload, no network')}]}}
    ],detached:[{id:'f',title:T('浮动主题也支持','Floating topics work too')}]}},
    relationships:[{end1Id:'c1',end2Id:'b3',title:T('会自动展开','auto-expands')}]}];
  setData(fromJson(JSON.stringify(demo)),t('demoName'),{});
};

/* ================= PWA：离线缓存、安装、文件关联 ================= */
function promptInstall(){ if(!installEvt) return; installEvt.prompt(); installEvt.userChoice.then(()=>{ installEvt=null; $('#eInstall').hidden=true; buildMenus(); }).catch(()=>{}); }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('#eInstall').hidden=false; buildMenus(); });
window.addEventListener('appinstalled',()=>{ installEvt=null; $('#eInstall').hidden=true; buildMenus(); toast(t('installed')); });
$('#eInstallBtn').onclick=promptInstall;
if(/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
if('launchQueue' in window&&window.launchQueue.setConsumer){ window.launchQueue.setConsumer(async p=>{ if(!p.files||!p.files.length) return; try{ loadFile(await p.files[0].getFile()); }catch(e){ errEl.textContent=t('errFail')+(e.message||e); } }); }
window.Mindlook={open:loadBuffer,parse:parseSource,sniff:sniffKind,exportImage,toMarkdown,toText,buildSvg,setMode,setLevel,search:runSearch,state};
/* ================= 启动 ================= */
applyTheme(); applyLang();
if(window.XMIND_FILE){
  const f=window.XMIND_FILE; const u=b64(f.b64); delete window.XMIND_FILE;
  withBusy(()=>loadBuffer(u.buffer,f.name)).catch(e=>{ errEl.textContent=t('errFail')+(e.message||e); emptyEl.classList.remove('hidden'); });
}
if(window.XMIND_DATA){
  const d=window.XMIND_DATA;
  withBusy(async()=>{ const kind=d.format==='xml'||d.format==='json'?d.format:sniffKind(d.name,new TextEncoder().encode(String(d.content||'').slice(0,4096))); setData(parseSource(kind,d.content,d.name),d.name,await prepareRes(d.resources||{})); })
    .catch(e=>{ errEl.textContent=t('errFail')+(e.message||e); });
}
})();
</script>
