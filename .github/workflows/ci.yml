name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile xmindview.py
      - name: Shell syntax
        run: bash -n xmindview
      - name: CLI renders every bundled sample (.xmind, .mm, .opml, .md, .txt)
        run: |
          dir="$(mktemp -d)"
          for f in samples/sample.xmind samples/sample.mm samples/sample.opml samples/sample.md samples/sample.txt; do
            out="$dir/$(basename "$f").html"
            ./xmindview --no-open -o "$out" "$f"
            test -s "$out" && grep -q 'window.XMIND_DATA=' "$out" || { echo "render failed: $f"; exit 1; }
          done
      - name: Samples are well-formed (XML parses, text is UTF-8)
        run: |
          python3 - <<'PY'
          import xml.dom.minidom, pathlib
          for f in ("samples/sample.mm", "samples/sample.opml"):
              xml.dom.minidom.parse(f)
          for f in ("samples/sample.md", "samples/sample.txt"):
              pathlib.Path(f).read_text(encoding="utf-8")
          PY
      - name: Manifest is valid JSON
        run: python3 -c "import json;json.load(open('manifest.webmanifest'))"
      - name: No network references in app files
        # The only URLs allowed in the app are W3C namespace identifiers (SVG / XHTML / XLink); they are never fetched.
        run: |
          if grep -noE "https?://[^\"' <)]+" index.html sw.js | grep -vE "^[^:]+:[0-9]+:https?://www\.w3\.org/(2000/svg|1999/(xhtml|xlink))$"; then
            echo "unexpected URL in app files"; exit 1
          fi
          ! grep -nE "<(script|link)[^>]+(src|href)=[\"']https?:" index.html
